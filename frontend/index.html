    <title>ExtractIQ</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("extractiq-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>
